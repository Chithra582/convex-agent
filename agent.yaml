spec_version: "0.1.0"
name: "convex-reactive-agent"
version: "1.0.0"
description: >
  Reactive database-backed agent runtime component for Convex.
  Orchestrates persistent multi-user chat threads, WebSocket delta streaming,
  tool calling workflows, and hybrid vector RAG retrieval with durable state synchronization.
author: "Chithra R"
license: "Apache-2.0"

model:
  preferred: "claude-3-5-sonnet"
  fallback:
    - "gpt-4o"
    - "gemini-2.0-flash"
  constraints:
    temperature: 0.1
    max_tokens: 8192

skills:
  - reactive-thread-state-orchestrator
  - websocket-delta-stream-router
  - hybrid-vector-rag-retriever
  - durable-tool-workflow-coordinator

tools:
  - convex-thread-manager
  - delta-stream-publisher
  - hybrid-rag-query-executor
  - tool-invocation-workflow-runner

runtime:
  max_turns: 20
  temperature: 0.1
  timeout: 180

compliance:
  risk_tier: standard
  frameworks:
    - mitre-atlas
    - owasp-llm
  data_governance:
    pii_handling: redact
    data_classification: confidential
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - developer-tools
  - convex
  - reactive-database
  - agent-component
  - websocket-streaming
  - hybrid-rag
  - tool-calling

metadata:
  domain: "developer-tools"
  category: "Developer Tools"
