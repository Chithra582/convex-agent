name: "delta-stream-publisher"
description: "Broadcasts incremental token deltas and structured object updates over WebSocket channels."
input_schema:
  type: "object"
  properties:
    thread_id:
      type: "string"
      description: "Identifier of the target conversation thread."
    delta_type:
      type: "string"
      description: "Type of delta payload (text_chunk, object_patch, completion_signal)."
    payload:
      type: "string"
      description: "Serialized delta content to publish."
  required:
    - "thread_id"
    - "delta_type"
    - "payload"
